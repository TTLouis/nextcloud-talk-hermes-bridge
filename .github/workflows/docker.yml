name: Manual secured image build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - run: python -m unittest discover -s tests/secure -v
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: e06df9c2eae6901f4c88f464e0ae6e753c0428b8
          path: runtime/hermes
          persist-credentials: false
      - run: docker build --target bridge -f Dockerfile.secure -t local/hermes-talk-bridge:checked .
      - run: docker build --target connector -f Dockerfile.secure -t local/hermes-talk-connector:checked .
      - run: docker build --target worker -f Dockerfile.secure -t local/hermes-talk-worker:checked .
      - run: docker build --target delivery -f Dockerfile.secure -t local/hermes-talk-delivery:checked .
