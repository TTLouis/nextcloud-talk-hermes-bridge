name: hermes-talk
services:
  bridge:
    image: ${BRIDGE_IMAGE:?Set immutable bridge image ID}
    pull_policy: never
    container_name: hermes-talk-bridge
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes:
      - ./secrets/bridge.json:/run/config/bridge.json:ro
      - ./state-bridge:/state
    extra_hosts:
      - nextcloud.direct.ttlouis.space:host-gateway
    networks: [nextcloud, jobs]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8788/heartbeat',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: 5m, max-file: "2"}
  runner-ttauth:
    image: ${RUNNER_IMAGE:?Set immutable runner image ID}
    pull_policy: never
    container_name: hermes-talk-runner-ttauth
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 96
    tmpfs: ["/tmp:size=128m,mode=1777"]
    volumes:
      - ./secrets/runner-ttauth.json:/run/config/runner.json:ro
      - ./state-ttauth:/state
    extra_hosts:
      - nextcloud.direct.ttlouis.space:host-gateway
    networks: [jobs, nextcloud, models]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8789/heartbeat',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: 5m, max-file: "2"}
networks:
  jobs:
    internal: true
  nextcloud:
    external: true
    name: nextcloud_nextcloud_internal
  models:
    external: true
    name: ai-gateway-private
